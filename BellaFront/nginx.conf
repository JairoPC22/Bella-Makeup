server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae a index.html, para
    # que React Router (admin y storefront) maneje la navegación directa a
    # URLs como /admin/pos o /catalogo sin un 404 del servidor.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpe?g|webp|ico)$ {
        expires 30d;
        access_log off;
    }
}
